services:
  db:
    image: postgres:18
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: lotterylunch
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: lotterylunch
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lotterylunch -d lotterylunch']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:24-bookworm
    working_dir: /app
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgres://lotterylunch:devpass@db:5432/lotterylunch
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', './scripts/start-dev.sh']

volumes:
  app_node_modules:
  app_next:
