version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase'
    groups:
      next:
        patterns: ['next', 'eslint-config-next', '@next/env']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      prisma:
        patterns: ['prisma', '@prisma/*']
      better-auth:
        patterns: ['better-auth', '@better-auth/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
    ignore:
      # TypeScript 7 is outside typescript-eslint's supported peer range.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # eslint-plugin-import currently supports ESLint through v9.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
